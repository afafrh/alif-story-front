<div
  class="alert d-flex align-items-center"
  [ngClass]="{ 'alert-success': data.isSuccess, 'alert-danger': data.isError }"
  role="alert"
>
  <mat-icon *ngIf="data.isSuccess" class="alert-icon text-success"
    >check_circle</mat-icon
  >
  <mat-icon *ngIf="data.isError" class="alert-icon text-danger">error</mat-icon>
  <span class="alert-text">{{ data.message }}</span>
</div>

<div *ngIf="!isMobile">
  <div
    class="alif-experience"
    *ngIf="direction !== ''"
    [style.flex-direction]="direction === 'right' ? 'row' : 'row-reverse'"
  >
    <div
      class="content"
      *ngIf="direction !== ''"
      [style.text-align]="direction === 'right' ? 'right' : 'left'"
    >
      <h1>{{ title }}</h1>
      <p>{{ description }}</p>
    </div>
    <div class="number">
      <img [src]="number" alt="" />
    </div>
    <div class="img">
      <img [src]="path" alt="" />
    </div>
  </div>

  <div class="alif-experience" *ngIf="direction === ''">
    <div class="content">
      <h4>{{ title }}</h4>
      <p>{{ description }}</p>
    </div>
    <div class="number">
      <img [src]="number" alt="" />
    </div>
    <div class="img">
      <img [src]="path" alt="" />
    </div>
  </div>
</div>
<div *ngIf="isMobile">
  <div class="alif-experience">
    <div class="img">
      <img [src]="path" alt="" />
    </div>
    <div class="content">
      <div class="number-title">
        <div class="number">
          <img [src]="number" alt="" />
        </div>
        <h1>{{ title }}</h1>
      </div>

      <p>{{ description }}</p>
    </div>
  </div>
</div>
